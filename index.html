<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>消費者家計簿（中学生向け）</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .phone-screen {
      width: 360px;
      height: 640px;
      background: white;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .app-section {
      display: none; 
      padding: 20px;
      flex: 1;
      overflow-y: auto;
    }
    .active { display: block; }
    
    h2 { text-align: center; color: #333; margin-top: 10px; }
    label { font-weight: bold; font-size: 14px; color: #495057; display: block; margin-top: 10px; }
    input[type="text"], input[type="number"], input[type="password"] {
      width: 90%;
      padding: 10px;
      font-size: 16px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    button:active { transform: scale(0.97); }
    .btn-primary { background: #4dabf7; color: white; }
    .btn-secondary { background: #e9ecef; color: #495057; }
    .btn-danger { background: #fa5252; color: white; }
    .btn-success { background: #40c057; color: white; }
    
    .hobby-checkboxes {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin: 10px 0;
    }
    .hobby-label {
      background: #f1f3f5;
      padding: 8px 6px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: normal;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      margin-top: 15px;
    }
    .calendar-day-name { text-align: center; font-size: 12px; font-weight: bold; color: #868e96; }
    .calendar-day {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: #f8f9fa;
      font-size: 14px;
      cursor: pointer;
      box-sizing: border-box;
    }
    .bg-today { border: 2px solid #228be6; font-weight: bold; background-color: #e7f5ff; }
    .bg-needs { background-color: #d0ebff !important; color: #1c7ed6; font-weight: bold; } 
    .bg-wants { background-color: #ffe3e3 !important; color: #e03131; font-weight: bold; } 
    .bg-both  { background-color: #eebefa !important; color: #ae3ec9; font-weight: bold; } 

    .type-selectors, .nw-selectors { display: flex; gap: 10px; margin-top: 5px; }
    .type-btn, .nw-btn { flex: 1; background: #e9ecef; color: #495057; }
    .type-btn.selected { background: #339af0; color: white; }
    .nw-btn.selected[data-val="Needs"] { background: #228be6; color: white; }
    .nw-btn.selected[data-val="Wants"] { background: #fa5252; color: white; }
    
    .hobby-pool {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
    }
    .tag-btn { background: #f1f3f5; font-size: 13px; padding: 10px 5px; margin: 0; }
    .tag-btn.selected { background: #fab005; color: white; }
    
    .status-card {
      background: linear-gradient(135deg, #e7f5ff, #d0ebff);
      padding: 15px;
      border-radius: 16px;
      margin-bottom: 15px;
    }
    .level-badge {
      display: inline-block;
      background: #228be6;
      color: white;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
    }
    .title-badge { font-weight: bold; color: #1c7ed6; font-size: 15px; margin-left: 8px; }
    .xp-bar-container { background: #e9ecef; height: 10px; border-radius: 5px; margin-top: 8px; overflow: hidden; }
    .xp-bar-fill { background: linear-gradient(90deg, #4dabf7, #339af0); height: 100%; width: 0%; transition: width 0.8s ease; }

    .streak-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff3bf;
      color: #f59f00;
      border: 1px solid #ffe066;
      border-radius: 12px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: bold;
      margin-top: 10px;
      text-align: center;
    }

    .levelup-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .levelup-overlay.show { opacity: 1; pointer-events: auto; }
    .levelup-card { background: white; width: 280px; padding: 30px 20px; border-radius: 24px; text-align: center; }
    .sparkle { position: absolute; width: 8px; height: 8px; border-radius: 50%; opacity: 0; }

    .admin-user-card {
      background: #f1f3f5;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      border-left: 5px solid #228be6;
      position: relative;
    }

    /* 実績カードスタイル */
    .achievement-card {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .achievement-card.completed {
      background: #e6fcf5;
      border-color: #63e6be;
    }
    .achievement-info {
      flex: 1;
      padding-right: 10px;
    }
    .achievement-title {
      font-weight: bold;
      font-size: 14px;
      color: #333;
    }
    .achievement-desc {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
    }
    .achievement-reward {
      font-size: 11px;
      font-weight: bold;
      color: #fab005;
      margin-top: 4px;
    }

    .nav-bar {
      height: 60px;
      border-top: 1px solid #dee2e6;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #f8f9fa;
    }
    .nav-item { cursor: pointer; font-size: 15px; font-weight: bold; color: #495057; }
    .nav-item.active-nav { color: #339af0; }
  </style>
</head>
<body>

<div class="phone-screen">

  <div id="levelup-overlay" class="levelup-overlay" onclick="closeLevelUp()">
    <div class="levelup-card">
      <h3 style="font-size: 28px; color: #fab005; margin: 10px 0;">LEVEL UP!!</h3>
      <p id="levelup-text" style="font-size: 16px; font-weight: bold; margin: 10px 0; color: #333;"></p>
      <p id="levelup-title-text" style="font-size: 14px; color: #228be6; font-weight: bold; margin: 0;"></p>
      <button class="btn-primary" style="margin-top: 20px;" onclick="closeLevelUp()">次へ</button>
    </div>
  </div>

  <div id="sec-login" class="app-section active">
    <h2 style="margin-top: 50px;">賢い消費者家計簿Ver.1.3.0</h2>
    <p style="text-align: center; color: #868e96; font-size: 14px;">ログインして始めよう</p>
    
    <label>ユーザーネーム</label>
    <input type="text" id="login-username" placeholder="ユーザーネーム">
    
    <label>パスワード</label>
    <input type="password" id="login-password" placeholder="パスワード">
    
    <button class="btn-primary" style="margin-top: 30px;" onclick="login()">ログイン</button>
    <button class="btn-secondary" onclick="goToRegisterStep1()">新しくアカウントを作る</button>
  </div>

  <div id="sec-account-step1" class="app-section">
    <h2>プロフィール登録 (1/2)</h2>
    
    <label>名前</label>
    <input type="text" id="acc-name" placeholder="例：たかし">
    
    <label>年齢</label>
    <input type="number" id="acc-age" placeholder="例：14" oninput="calculateBirthYear()">
    
    <label>誕生日</label>
    <div style="display: flex; gap: 10px; width: 90%; margin-top: 5px;">
      <select id="acc-birth-month" onchange="calculateBirthYear()" style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;">
        <option value="">月を選択</option>
        <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option>
        <option value="4">4月</option><option value="5">5月</option><option value="6">6月</option>
        <option value="7">7月</option><option value="8">8月</option><option value="9">9月</option>
        <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
      </select>
      <select id="acc-birth-day" onchange="calculateBirthYear()" style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;">
        <option value="">日を選択</option>
      </select>
    </div>
    
    <label>生年月日 (誕生年)</label>
    <input type="text" id="acc-birthyear-display" placeholder="自動計算されます" readonly style="background-color: #e9ecef;">
    
    <label>今持っている金額 (円) ※最大100万円まで</label>
    <input type="number" id="acc-balance" placeholder="例：3000" max="1000000">

    <label>君の趣味 (複数選んでね！)</label>
    <div class="hobby-checkboxes">
      <label class="hobby-label"><input type="checkbox" class="hobby-cb" value="ゲーム・課金" checked> ゲーム・課金</label>
      <label class="hobby-label"><input type="checkbox" class="hobby-cb" value="マンガ・本"> マンガ・本</label>
      <label class="hobby-label"><input type="checkbox" class="hobby-cb" value="アニメ・グッズ"> アニメ・グッズ</label>
      <label class="hobby-label"><input type="checkbox" class="hobby-cb" value="推し活・アイドル"> 推し活・アイドル</label>
      <label class="hobby-label"><input type="checkbox" class="hobby-cb" value="買い食い・お菓子"> 買い食い・お菓子</label>
      <label class="hobby-label"><input type="checkbox" class="hobby-cb" value="カフェ・ジュース"> カフェ・ジュース</label>
      <label class="hobby-label"><input type="checkbox" class="hobby-cb" value="服・コスメ・おしゃれ"> 服・コスメ・おしゃれ</label>
      <label class="hobby-label"><input type="checkbox" class="hobby-cb" value="文房具・雑貨"> 文房具・雑貨</label>
      <label class="hobby-label"><input type="checkbox" class="hobby-cb" value="カラオケ・プリクラ"> カラオケ・プリクラ</label>
      <label class="hobby-label"><input type="checkbox" class="hobby-cb" value="映画・イベント"> 映画・イベント</label>
      <label class="hobby-label"><input type="checkbox" class="hobby-cb" value="トレカ・カード"> トレカ・カード</label>
      <label class="hobby-label"><input type="checkbox" class="hobby-cb" value="ガチャガチャ"> ガチャガチャ</label>
      <label class="hobby-label"><input type="checkbox" class="hobby-cb" value="スポーツ・部活"> スポーツ・部活</label>
      <label class="hobby-label"><input type="checkbox" class="hobby-cb" value="音楽・楽器"> 音楽・楽器</label>
      <label class="hobby-label"><input type="checkbox" class="hobby-cb" value="パソコン・ガジェット"> PC・ガジェット</label>
    </div>
    
    <button class="btn-primary" onclick="goToRegisterStep2()">次へ進む</button>
    <button class="btn-secondary" onclick="switchSection('login')">戻る</button>
  </div>

  <div id="sec-account-step2" class="app-section">
    <h2>ログイン設定 (2/2)</h2>
    <p style="font-size: 13px; color: #868e96; text-align: center;">次回からログインするときに使います</p>
    
    <label>ユーザーネーム</label>
    <input type="text" id="acc-username" placeholder="例：takashi123">
    
    <label>パスワード</label>
    <input type="password" id="acc-password" placeholder="パスワードを入力">
    
    <button class="btn-primary" style="margin-top: 30px;" onclick="registerAccount()">アカウントを作成して完了！</button>
    <button class="btn-secondary" onclick="switchSection('account-step1')">戻る</button>
  </div>

  <div id="sec-home" class="app-section">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2 id="home-welcome" style="font-size: 18px; margin: 0;">こんにちは</h2>
      <button class="btn-secondary" style="width: auto; padding: 6px 12px; margin: 0; font-size: 12px;" onclick="logout()">ログアウト</button>
    </div>
    
    <div class="status-card" style="margin-top: 15px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div>
          <span class="level-badge" id="status-level">Lv.1</span>
          <span class="title-badge" id="status-title">お買い物見習い</span>
        </div>
        <div id="status-xp-text" style="font-size: 12px; color: #495057; font-weight: bold;">0 / 30 XP</div>
      </div>
      <div class="xp-bar-container">
        <div class="xp-bar-fill" id="status-xp-bar"></div>
      </div>
      <div class="streak-badge" id="status-streak">連続記録：1日目</div>
    </div>

    <p id="home-birth-year" style="text-align: center; font-size: 12px; color: #868e96; margin: -5px 0 15px 0;"></p>
    <div style="width: 200px; height: 200px; margin: 10px auto;">
      <canvas id="ratioChart"></canvas>
    </div>
    <div id="home-current-wallet" style="text-align: center; font-size: 18px; font-weight: bold; color: #2b8a3e; margin-top: 10px;"></div>
    <div id="home-summary" style="text-align: center; margin-top: 10px; font-size: 14px; color: #666;"></div>
  </div>

  <div id="sec-calendar" class="app-section">
    <h2 id="calendar-title"></h2>
    <div class="calendar-grid">
      <div class="calendar-day-name">日</div><div class="calendar-day-name">月</div><div class="calendar-day-name">火</div>
      <div class="calendar-day-name">水</div><div class="calendar-day-name">木</div><div class="calendar-day-name">金</div>
      <div class="calendar-day-name">土</div>
    </div>
    <div id="calendar-days" class="calendar-grid"></div>
  </div>

  <div id="sec-achievements" class="app-section">
    <h2>実績・ミッション</h2>
    <div class="status-card" style="margin-bottom: 15px; background: linear-gradient(135deg, #fff9db, #fff3bf);">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-weight: bold; font-size: 14px; color: #f59f00;">達成率</span>
        <span id="achievement-progress-text" style="font-weight: bold; font-size: 14px; color: #f59f00;">0 / 30</span>
      </div>
      <div class="xp-bar-container">
        <div class="xp-bar-fill" id="achievement-progress-bar" style="background: linear-gradient(90deg, #fab005, #f59f00);"></div>
      </div>
    </div>
    <div id="achievement-list"></div>
  </div>

  <div id="sec-input" class="app-section">
    <h2>お財布に記録</h2>
    <p id="target-date-display" style="text-align:center; font-weight:bold; color:#666;"></p>
    
    <input type="number" id="input-amount" placeholder="金額を入力 (円)">
    
    <div class="type-selectors" style="margin-bottom:15px;">
      <button class="type-btn selected" data-val="支出" onclick="selectType('支出')">だしたお金</button>
      <button class="type-btn" data-val="収入" onclick="selectType('収入')">はいったお金</button>
    </div>

    <div id="nw-wrapper" style="margin-bottom:15px;">
      <label>どっちの種類？</label>
      <div class="nw-selectors">
        <button class="nw-btn" data-val="Needs" onclick="selectNW('Needs')">Needs (必要)</button>
        <button class="nw-btn" data-val="Wants" onclick="selectNW('Wants')">Wants (欲しいもの)</button>
      </div>
    </div>

    <div id="tag-wrapper" style="margin-bottom:15px; display:none;">
      <label>何に使った？（1タップ選択）</label>
      <div id="hobby-pool" class="hobby-pool"></div>
      <input type="text" id="input-memo" placeholder="その他の内容" style="display:none;">
    </div>

    <button class="btn-primary" style="background:#2b8a3e;" onclick="saveTransaction()">保存して10XPゲット！</button>
  </div>

  <div id="sec-admin" class="app-section">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>管理者ページ</h2>
      <button class="btn-secondary" style="width: auto; padding: 6px 12px; margin: 0; font-size: 12px;" onclick="logout()">ログアウト</button>
    </div>
    <p style="font-size: 12px; color: #e03131; text-align: center; font-weight: bold;">重複アカウントは1つに自動統合して表示中</p>
    
    <div id="admin-user-list" style="margin-top: 15px;"></div>
  </div>

  <div id="app-nav" class="nav-bar" style="display:none;">
    <div id="nav-home" class="nav-item" onclick="switchSection('home')">グラフ</div>
    <div id="nav-calendar" class="nav-item" onclick="switchSection('calendar')">カレンダー</div>
    <div id="nav-achievements" class="nav-item" onclick="switchSection('achievements')">実績</div>
  </div>

</div>

  function calculateWallet(u, h) {
    if (!u) return 0;
    let needsSum = 0; let wantsSum = 0; let incomeSum = 0;
    h.forEach(item => {
      if (item.type === '収入') incomeSum += item.amount;
      else if (item.category === 'Needs') needsSum += item.amount;
      else if (item.category === 'Wants') wantsSum += item.amount;
    });
    let wallet = u.initialBalance + incomeSum - (needsSum + wantsSum);
    return wallet > MAX_BALANCE ? MAX_BALANCE : wallet;
  }

  function getTitle(lvl) {
    if (lvl >= 30) return "賢い消費者";
    if (lvl >= 20) return "お小遣いマスター";
    if (lvl >= 10) return "買い物の達人";
    return "お買い物見習い";
  }

  function getRequiredTotalXp(level) {
    if (level <= 1) return 0;
    let total = 0;
    for (let i = 1; i < level; i++) {
      total += i * 30;
    }
    return total;
  }

  function calculateLevelFromXp(xp) {
    let lvl = 1;
    while (lvl < 99) {
      if (xp < getRequiredTotalXp(lvl + 1)) {
        return lvl;
      }
      lvl++;
    }
    return 99;
  }

  async function checkLoginBonus() {
    if (!userAccount || myUID === "ADMIN_USER") return;
    const now = new Date();
    const todayStr = `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}-${now.getDate().toString().padStart(2,'0')}`;
    
    if (userAccount.lastLoginDate !== todayStr) {
      let streak = userAccount.streak || 0;
      if (userAccount.lastLoginDate) {
        const lastDate = new Date(userAccount.lastLoginDate);
        const diffTime = Math.abs(now - lastDate);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        if (diffDays <= 2) {
          streak += 1;
        } else {
          streak = 1;
        }
      } else {
        streak = 1;
      }

      const streakBonus = streak * 2;
      const gainedXp = 10 + streakBonus;
      const oldXp = userAccount.xp || 0;
      const newXp = oldXp + gainedXp;
      const oldLvl = userAccount.level || 1;
      const newLvl = calculateLevelFromXp(newXp);

      userAccount.xp = newXp;
      userAccount.level = newLvl;
      userAccount.streak = streak;
      userAccount.lastLoginDate = todayStr;

      try {
        await setDoc(doc(db, "users", myUID), userAccount);
        alert(`ログインボーナス！ ${streak}日連続達成で ${gainedXp}XP (基本10XP + ボーナス${streakBonus}XP) を獲得しました！`);
        if (newLvl > oldLvl) {
          triggerLevelUpEffects(oldLvl, newLvl);
        }
      } catch(e) {
        console.error(e);
      }
    }
  }

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      myUID = user.uid;
      if (user.email === ADMIN_EMAIL) {
        switchSection('admin');
        loadAdminData();
      } else {
        try {
          const d = await getDoc(doc(db, "users", myUID));
          if (d.exists()) {
            userAccount = d.data();
            if (userAccount.xp === undefined) { userAccount.xp = 0; userAccount.level = 1; }
            if (userAccount.streak === undefined) { userAccount.streak = 1; }
            if (userAccount.claimedAchievements === undefined) { userAccount.claimedAchievements = []; }
            
            const q = query(collection(db, "users", myUID, "history"));
            const querySnapshot = await getDocs(q);
            transactionHistory = [];
            querySnapshot.forEach((doc) => { transactionHistory.push(doc.data()); });
            
            document.getElementById('app-nav').style.display = 'flex';
            await checkLoginBonus();
            switchSection('home');
          } else {
            switchSection('login');
          }
        } catch(e) {
          console.error(e);
          switchSection('login');
        }
      }
    } else {
      switchSection('login');
    }
  });

  window.calculateBirthYear = function() {
    const ageInput = document.getElementById('acc-age').value;
    const monthInput = document.getElementById('acc-birth-month').value;
    const dayInput = document.getElementById('acc-birth-day').value;
    const displayInput = document.getElementById('acc-birthyear-display');
    
    if (ageInput && monthInput && dayInput) {
      const age = parseInt(ageInput);
      const month = parseInt(monthInput);
      const day = parseInt(dayInput);
      
      const now = new Date();
      const todayYear = now.getFullYear();
      const todayMonth = now.getMonth() + 1;
      const todayDay = now.getDate();
      
      let birthYear = todayYear - age;
      if (month > todayMonth || (month === todayMonth && day > todayDay)) {
        birthYear -= 1;
      }
      
      displayInput.value = `${birthYear}年 ${month}月${day}日 生まれ`;
      displayInput.dataset.calculatedYear = birthYear;
    } else {
      displayInput.value = "";
      delete displayInput.dataset.calculatedYear;
    }
  }

    document.getElementById(`sec-${secName}`).classList.add('active');
    
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-nav'));
    if (secName === 'home' || secName === 'calendar' || secName === 'achievements') {
      document.getElementById(`nav-${secName}`).classList.add('active-nav');
    }

    if (secName === 'home') { updateHomeGraph(); }
    if (secName === 'calendar') { renderCalendar(); }
    if (secName === 'achievements') { renderAchievements(); }
    if (secName === 'admin') { loadAdminData(); }
  }

  window.login = async function() {
    const userInput = document.getElementById('login-username').value.trim();
    const pass = document.getElementById('login-password').value.trim();

    if (!userInput || !pass) { alert("ユーザーネーム（またはメール）とパスワードを入力してください。"); return; }

    const email = userInput.includes('@') ? userInput : `${userInput}@smart-consumer.com`;

    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch(e) {
      alert("ログインに失敗しました。ユーザーネームまたはパスワードを確認してください。");
    }
  }

  window.logout = function() {
    signOut(auth).then(() => {
      userAccount = null;
      transactionHistory = [];
      document.getElementById('app-nav').style.display = 'none';
      switchSection('login');
    });
  }

  window.goToRegisterStep1 = function() { switchSection('account-step1'); }

  window.goToRegisterStep2 = function() {
    const name = document.getElementById('acc-name').value;
    const age = parseInt(document.getElementById('acc-age').value);
    let initBalance = parseInt(document.getElementById('acc-balance').value) || 0;
    const birthYearDisplay = document.getElementById('acc-birthyear-display');
    const month = document.getElementById('acc-birth-month').value;
    const day = document.getElementById('acc-birth-day').value;

    if (!name || !age || !month || !day) { 
      alert('名前、年齢、誕生日をすべて入力してください。'); 
      return; 
    }

    if (initBalance > MAX_BALANCE) {
      alert('所持金の上限は1,000,000円です。1,000,000円に設定します。');
      initBalance = MAX_BALANCE;
    }

    const calculatedYear = parseInt(birthYearDisplay.dataset.calculatedYear);
    const checkedHobbies = [];
    document.querySelectorAll('.hobby-cb:checked').forEach(cb => checkedHobbies.push(cb.value));

    tempProfile = {
      name: name,
      age: age,
      birthYear: calculatedYear,
      birthday: `${month}月${day}日`,
      initialBalance: initBalance,
      hobbies: checkedHobbies,
      xp: 0,
      level: 1,
      streak: 1,
      lastLoginDate: "",
      claimedAchievements: []
    };

    switchSection('account-step2');
  }

  window.registerAccount = async function() {
    const user = document.getElementById('acc-username').value.trim();
    const pass = document.getElementById('acc-password').value.trim();

    if (!user || !pass) { alert('ユーザーネームとパスワードを決めてください。'); return; }

    const email = `${user}@smart-consumer.com`;

    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
      myUID = userCredential.user.uid;

      userAccount = {
        ...tempProfile,
        username: user
      };

      await setDoc(doc(db, "users", myUID), userAccount);
    } catch(e) {
      if (e.code === 'auth/email-already-in-use') {
        alert("そのユーザーネームは既に使われています。別の名前を試してください。");
      } else {
        alert("アカウント作成に失敗しました: " + e.message);
      }
    }
  }

  async function loadAdminData() {
    const listDiv = document.getElementById('admin-user-list');
    listDiv.innerHTML = "データを読み込み中...";

    try {
      const usersSnapshot = await getDocs(collection(db, "users"));
      const displayUsers = [];

      usersSnapshot.forEach(uDoc => {
        displayUsers.push({
          uid: uDoc.id,
          profile: uDoc.data()
        });
      });

      listDiv.innerHTML = "";

      if (displayUsers.length === 0) {
        listDiv.innerHTML = "<p style='text-align:center;'>表示できるユーザーアカウントがありません。</p>";
        return;
      }

      for (const user of displayUsers) {
        const uData = user.profile;
        const uid = user.uid;

        const histSnapshot = await getDocs(collection(db, "users", uid, "history"));
        let histories = [];
        histSnapshot.forEach(hDoc => {
          histories.push(hDoc.data());
        });

        histories.sort((a, b) => new Date(b.date) - new Date(a.date));

        let histHTML = "";
        histories.forEach(h => {
          histHTML += `<li>${h.date} | [${h.type}] ${h.category || ''} (${h.tag || ''}) : <strong>${h.amount}円</strong></li>`;
        });

        const userCard = document.createElement('div');
        userCard.classList.add('admin-user-card');
        userCard.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: flex-start;">
            <h3 style="margin: 0 0 5px 0;">${uData.name}さん (${uData.age}歳)</h3>
            <button class="btn-danger" style="width: auto; padding: 4px 10px; font-size: 11px; margin: 0;" onclick="deleteUserAccount('${uid}', '${uData.name}')">
              アカウント削除
            </button>
          </div>
          <p style="font-size:12px; color:#666; margin:0;">
            ユーザーID: <strong>${uData.username}</strong><br>
            生年月日: ${uData.birthYear || '-'}年 ${uData.birthday || ''}<br>
            レベル: Lv.${uData.level || 1} (${uData.xp || 0} XP) | 連続記録: ${uData.streak || 1}日目<br>
            初期所持金: ${uData.initialBalance}円
          </p>
          <h4 style="margin: 10px 0 5px 0; font-size:13px;">家計簿記録一覧 (合計 ${histories.length} 件):</h4>
          <ul style="font-size:12px; padding-left:20px; margin:0; max-height: 150px; overflow-y: auto;">
            ${histHTML ? histHTML : '<span style="color:#ae3ec9;">記録なし</span>'}
          </ul>
        `;
        listDiv.appendChild(userCard);
      }
    } catch(e) {
      console.error(e);
      listDiv.innerHTML = "データの取得に失敗しました（権限がありません）。";
    }
  }

  window.deleteUserAccount = async function(uid, userName) {
    const confirmDelete = confirm(`「${userName}」さんのアカウントを削除しますか？`);
    if (!confirmDelete) return;

    try {
      const batch = writeBatch(db);
      const histSnapshot = await getDocs(collection(db, "users", uid, "history"));
      histSnapshot.forEach(hDoc => { batch.delete(hDoc.ref); });
      batch.delete(doc(db, "users", uid));

      await batch.commit();
      alert(`「${userName}」さんのアカウントを削除しました。`);
      loadAdminData();
    } catch(e) {
      console.error(e);
      alert("削除処理中にエラーが発生しました。");
    }
  }

  function updateHomeGraph() {
    if (!userAccount) return;
    document.getElementById('home-welcome').innerText = `こんにちは、${userAccount.name}さん `;
    
    const birthString = userAccount.birthday ? `${userAccount.birthYear}年 ${userAccount.birthday} 生まれ` : `${userAccount.birthYear || '-'}年生まれ`;
    document.getElementById('home-birth-year').innerText = birthString;

    const currentLvl = userAccount.level || 1;
    const currentXp = userAccount.xp || 0;
    const currentStreak = userAccount.streak || 1;

    const baseTotalXp = getRequiredTotalXp(currentLvl);
    const nextTotalXp = getRequiredTotalXp(currentLvl + 1);
    const xpNeededForThisLvl = nextTotalXp - baseTotalXp;
    const xpInThisLvl = currentXp - baseTotalXp;
    
    let xpPercent = 100;
    if (currentLvl < 99) {
      xpPercent = Math.min((xpInThisLvl / xpNeededForThisLvl) * 100, 100);
    }

    document.getElementById('status-level').innerText = `Lv.${currentLvl}`;
    document.getElementById('status-title').innerText = getTitle(currentLvl);
    document.getElementById('status-streak').innerText = `連続記録：${currentStreak}日目`;
    
    if (currentLvl >= 99) {
      document.getElementById('status-xp-text').innerText = `MAX (${currentXp} XP)`;
    } else {
      document.getElementById('status-xp-text').innerText = `${xpInThisLvl} / ${xpNeededForThisLvl} XP`;
    }
    
    setTimeout(() => {
      document.getElementById('status-xp-bar').style.width = `${xpPercent}%`;
    }, 100);

    let needsSum = 0; let wantsSum = 0; let incomeSum = 0;
    
    transactionHistory.forEach(item => {
      if (item.type === '収入') incomeSum += item.amount;
      else if (item.category === 'Needs') needsSum += item.amount;
      else if (item.category === 'Wants') wantsSum += item.amount;
    });

    let calculatedWallet = userAccount.initialBalance + incomeSum - (needsSum + wantsSum);
    let isMax = false;
    if (calculatedWallet > MAX_BALANCE) {
      calculatedWallet = MAX_BALANCE;
      isMax = true;
    }

    document.getElementById('home-current-wallet').innerText = `いまのお財布：${calculatedWallet.toLocaleString()} 円${isMax ? ' (上限)' : ''}`;
    document.getElementById('home-summary').innerHTML = `Needs: ${needsSum.toLocaleString()}円 / Wants: ${wantsSum.toLocaleString()}円`;

    const ctx = document.getElementById('ratioChart').getContext('2d');
    if (chartInstance) { chartInstance.destroy(); } 
    
    if (needsSum === 0 && wantsSum === 0) {
      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: { labels: ['データなし'], datasets: [{ data: [1], backgroundColor: ['#e9ecef'] }] }
      });
      return;
    }

    chartInstance = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['Needs', 'Wants'],
        datasets: [{ data: [needsSum, wantsSum], backgroundColor: ['#339af0', '#fa5252'] }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });
  }

  function renderCalendar() {
    const container = document.getElementById('calendar-days');
    container.innerHTML = '';

    const now = new Date();
    const currentYear = now.getFullYear();
    const currentMonth = now.getMonth() + 1;
    const todayDate = now.getDate();

    document.getElementById('calendar-title').innerText = `${currentYear}年 ${currentMonth}月`;

    const firstDayOfWeek = new Date(currentYear, currentMonth - 1, 1).getDay();
    const totalDays = new Date(currentYear, currentMonth, 0).getDate();

    for (let i = 0; i < firstDayOfWeek; i++) {
      let emptyDiv = document.createElement('div');
      container.appendChild(emptyDiv);
    }

    for (let day = 1; day <= totalDays; day++) {
      let monthString = currentMonth.toString().padStart(2, '0');
      let dayStringFormatted = day.toString().padStart(2, '0');
      let dayString = `${currentYear}-${monthString}-${dayStringFormatted}`;

      let dayDiv = document.createElement('div');
      dayDiv.classList.add('calendar-day');
      
      if (day === todayDate) {
        dayDiv.classList.add('bg-today');
      }

      dayDiv.innerText = day;

      let dayNeeds = 0;
      let dayWants = 0;

      transactionHistory.forEach(h => {
        if (h.date === dayString && h.type === '支出') {
          if (h.category === 'Needs') dayNeeds += h.amount;
          if (h.category === 'Wants') dayWants += h.amount;
        }
      });

      if (dayNeeds > 0 && dayWants === 0) dayDiv.classList.add('bg-needs');
      else if (dayWants > 0 && dayNeeds === 0) dayDiv.classList.add('bg-wants');
      else if (dayNeeds > 0 && dayWants > 0) dayDiv.classList.add('bg-both');

      dayDiv.onclick = () => {
        selectedDate = dayString;
        openInputScreen();
      };

      container.appendChild(dayDiv);
    }
  }

  function renderAchievements() {
    if (!userAccount) return;
    const listDiv = document.getElementById('achievement-list');
    listDiv.innerHTML = '';

    if (!userAccount.claimedAchievements) {
      userAccount.claimedAchievements = [];
    }

    let completedCount = 0;

    const processedList = MASTER_ACHIEVEMENTS.map(ach => {
      const isFulfilled = ach.check(userAccount, transactionHistory);
      const isClaimed = userAccount.claimedAchievements.includes(ach.id);

      if (isClaimed) completedCount++;

      let priority = 1;
      if (isClaimed) {
        priority = 2;
      } else if (isFulfilled) {
        priority = 0;
      }

      return {
        ...ach,
        isFulfilled,
        isClaimed,
        priority
      };
    });

    processedList.sort((a, b) => a.priority - b.priority);

    processedList.forEach(ach => {
      const card = document.createElement('div');
      card.classList.add('achievement-card');
      if (ach.isClaimed) card.classList.add('completed');

      let actionButtonHTML = '';
      if (ach.isClaimed) {
        actionButtonHTML = `<span style="font-weight: bold; font-size: 12px; color: #12b886;">達成済み</span>`;
      } else if (ach.isFulfilled) {
        actionButtonHTML = `<button class="btn-success" style="width: auto; padding: 6px 12px; margin: 0; font-size: 12px;" onclick="claimReward('${ach.id}', ${ach.reward})">受領 +${ach.reward}XP</button>`;
      } else {
        actionButtonHTML = `<span style="font-weight: bold; font-size: 12px; color: #adb5bd;">未達成</span>`;
      }

      card.innerHTML = `
        <div class="achievement-info">
          <div class="achievement-title">${ach.title}</div>
          <div class="achievement-desc">${ach.desc}</div>
          <div class="achievement-reward">報酬: +${ach.reward} XP</div>
        </div>
        <div>${actionButtonHTML}</div>
      `;

      listDiv.appendChild(card);
    });

    const totalCount = MASTER_ACHIEVEMENTS.length;
    document.getElementById('achievement-progress-text').innerText = `${completedCount} / ${totalCount}`;
    const percent = (completedCount / totalCount) * 100;
    document.getElementById('achievement-progress-bar').style.width = `${percent}%`;
  }

  window.claimReward = async function(achId, rewardXp) {
    if (!userAccount) return;
    if (!userAccount.claimedAchievements) { userAccount.claimedAchievements = []; }

    userAccount.claimedAchievements.push(achId);

    const oldXp = userAccount.xp || 0;
    const newXp = oldXp + rewardXp;
    const oldLvl = userAccount.level || 1;
    const newLvl = calculateLevelFromXp(newXp);

    userAccount.xp = newXp;
    userAccount.level = newLvl;

    try {
      await setDoc(doc(db, "users", myUID), userAccount);
      alert(`実績達成！ ${rewardXp} XPを獲得しました！`);
      if (newLvl > oldLvl) {
        triggerLevelUpEffects(oldLvl, newLvl);
      }
      renderAchievements();
    } catch(e) {
      alert("報酬の受け取りに失敗しました。");
    }
  }

  function openInputScreen() {
    document.getElementById('target-date-display').innerText = `${selectedDate} の記録`;
    document.getElementById('input-amount').value = '';
    document.getElementById('input-memo').value = '';
    selectType('支出');
    selectNW('');
    switchSection('input');
  }

  window.selectType = function(type) {
    currentType = type;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
    document.querySelector(`.type-btn[data-val="${type}"]`).classList.add('selected');
    
    if (type === '収入') {
      document.getElementById('nw-wrapper').style.display = 'none';
      document.getElementById('tag-wrapper').style.display = 'none';
      currentNW = 'Income';
      currentTag = '収入';
    } else {
      document.getElementById('nw-wrapper').style.display = 'block';
      selectNW('');
    }
  }

  window.selectNW = function(nw) {
    currentNW = nw;
    document.querySelectorAll('.nw-btn').forEach(b => b.classList.remove('selected'));
    const btn = document.querySelector(`.nw-btn[data-val="${nw}"]`);
    if (btn) btn.classList.add('selected');
    
    const tagWrapper = document.getElementById('tag-wrapper');
    if (nw === 'Wants') {
      tagWrapper.style.display = 'block';
      buildHobbyButtons(); 
    } else {
      tagWrapper.style.display = 'none';
      currentTag = 'Needs'; 
    }
  }

  function buildHobbyButtons() {
    const pool = document.getElementById('hobby-pool');
    pool.innerHTML = '';
    
    if (userAccount && userAccount.hobbies) {
      userAccount.hobbies.forEach(hobby => {
        let btn = document.createElement('button');
        btn.classList.add('tag-btn');
        btn.innerText = hobby;
        btn.onclick = () => selectTag(hobby, btn);
        pool.appendChild(btn);
      });
    }
    
    let otherBtn = document.createElement('button');
    otherBtn.classList.add('tag-btn');
    otherBtn.innerText = 'その他';
    otherBtn.onclick = () => selectTag('unknown', otherBtn);
    pool.appendChild(otherBtn);
  }

  function selectTag(tag, element) {
    currentTag = tag;
    document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('selected'));
    element.classList.add('selected');
    
    const memoInput = document.getElementById('input-memo');
    if (tag === 'unknown') {
      memoInput.style.display = 'block';
    } else {
      memoInput.style.display = 'none';
    }
  }

  function triggerLevelUpEffects(oldLvl, newLvl) {
    document.getElementById('levelup-text').innerText = `Lv.${oldLvl} -> Lv.${newLvl}`;
    document.getElementById('levelup-title-text').innerText = `新しい称号：${getTitle(newLvl)}`;
    const overlay = document.getElementById('levelup-overlay');
    overlay.classList.add('show');
    for (let i = 0; i < 30; i++) { createSparkle(overlay); }
  }

  function createSparkle(parent) {
    const el = document.createElement('div');
    el.classList.add('sparkle');
    const colors = ['#ffd43b', '#4dabf7', '#ff8787', '#69db7c', '#da77f2'];
    el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    parent.appendChild(el);

    const angle = Math.random() * Math.PI * 2;
    const distance = 50 + Math.random() * 150;
    const x = Math.cos(angle) * distance;
    const y = Math.sin(angle) * distance;

    el.style.left = '50%'; el.style.top = '50%';
    el.style.transform = 'translate(-50%, -50%)';

    const anim = el.animate([
      { transform: 'translate(-50%, -50%) scale(0) rotate(0deg)', opacity: 0 },
      { transform: `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(1.5) rotate(${Math.random() * 360}deg)`, opacity: 1, offset: 0.2 },
      { transform: `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(0) rotate(${Math.random() * 720}deg)`, opacity: 0 }
    ], { duration: 1200 + Math.random() * 800, easing: 'cubic-bezier(0.1, 0.8, 0.3, 1)' });

    anim.onfinish = () => el.remove();
  }

  window.closeLevelUp = function() {
    document.getElementById('levelup-overlay').classList.remove('show');
  }

  window.saveTransaction = async function() {
    const amount = parseInt(document.getElementById('input-amount').value);
    if (!amount || amount <= 0) { alert('金額を入力してください。'); return; }
    if (currentType === '支出' && !currentNW) { alert('NeedsかWantsか選んでください。'); return; }
    if (currentNW === 'Wants' && !currentTag) { alert('何に使ったか選んでください。'); return; }
    
    const memo = document.getElementById('input-memo').value;
    const newRecord = {
      date: selectedDate,
      type: currentType,
      category: currentNW,
      tag: currentTag,
      amount: amount,
      memo: memo,
      createdAt: new Date().toISOString()
    };

    const oldXp = userAccount.xp || 0;
    const newXp = oldXp + 10;
    const oldLvl = userAccount.level || 1;
    const newLvl = calculateLevelFromXp(newXp);

    userAccount.xp = newXp;
    userAccount.level = newLvl;

    try {
      await addDoc(collection(db, "users", myUID, "history"), newRecord);
      await setDoc(doc(db, "users", myUID), userAccount);
      transactionHistory.push(newRecord);

      if (newLvl > oldLvl) {
        triggerLevelUpEffects(oldLvl, newLvl);
      }
      switchSection('home');
    } catch(e) {
      alert("データの保存に失敗しました。");
    }
  }
</script>
